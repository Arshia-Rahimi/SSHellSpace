[versions]
cmp = "1.12.2"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
appdirs = "1.5.0"
sqldelight = "2.4.1"
sqlite-jdbc = "3.54.1.0"
serialization-json = "1.12.0"
koin = "4.2.2"
koin-plugin = "1.2.3"
filekit = "0.17.0"
kotlinx-datetime = "0.8.0"
detekt = "2.0.0-alpha.6"
junit = "6.1.3"
mockk = "1.14.11"
nucleus = "2.5.18"
compose-icons = "2.2.1"
compose-unstyled = "2.10.2"
pty4j = "0.14.0"
bossterm = "1.2.184"
lifecycle = "2.11.0"
mina = "2.20.1"
bouncy-castle = "1.86"

[libraries]
#koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
#compose
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "cmp" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "cmp" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "cmp" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "cmp" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "cmp" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "cmp" }
compose-icons = { module = "com.composables:icons-radix-cmp", version.ref = "compose-icons" }
composeunstyled-theming = { module = "com.composables:composeunstyled-theming", version.ref = "compose-unstyled" }
composeunstyled-button = { module = "com.composables:composeunstyled-button", version.ref = "compose-unstyled" }
composeunstyled-text-field = { module = "com.composables:composeunstyled-text-field", version.ref = "compose-unstyled" }
composeunstyled-platformtheme = { module = "com.composables:composeunstyled-platformtheme", version.ref = "compose-unstyled" }
composeunstyled-dialog = { module = "com.composables:composeunstyled-dialog", version.ref = "compose-unstyled" }
composeunstyled-avatar = { module = "com.composables:composeunstyled-avatar", version.ref = "compose-unstyled" }
composeunstyled-checkbox = { module = "com.composables:composeunstyled-checkbox", version.ref = "compose-unstyled" }
composeunstyled-tri-state-checkbox = { module = "com.composables:composeunstyled-tri-state-checkbox", version.ref = "compose-unstyled" }
composeunstyled-disclosure = { module = "com.composables:composeunstyled-disclosure", version.ref = "compose-unstyled" }
composeunstyled-dropdown-menu = { module = "com.composables:composeunstyled-dropdown-menu", version.ref = "compose-unstyled" }
composeunstyled-icon = { module = "com.composables:composeunstyled-icon", version.ref = "compose-unstyled" }
composeunstyled-progress = { module = "com.composables:composeunstyled-progress", version.ref = "compose-unstyled" }
composeunstyled-radio-group = { module = "com.composables:composeunstyled-radio-group", version.ref = "compose-unstyled" }
composeunstyled-separators = { module = "com.composables:composeunstyled-separators", version.ref = "compose-unstyled" }
composeunstyled-slider = { module = "com.composables:composeunstyled-slider", version.ref = "compose-unstyled" }
composeunstyled-tab-group = { module = "com.composables:composeunstyled-tab-group", version.ref = "compose-unstyled" }
composeunstyled-toggle-switch = { module = "com.composables:composeunstyled-toggle-switch", version.ref = "compose-unstyled" }
composeunstyled-tooltip = { module = "com.composables:composeunstyled-tooltip", version.ref = "compose-unstyled" }
composeunstyled-escape-handler = { module = "com.composables:composeunstyled-escape-handler", version.ref = "compose-unstyled" }
composeunstyled-modal = { module = "com.composables:composeunstyled-modal", version.ref = "compose-unstyled" }
#kotlin
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
#sqldelight
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight"}
sqldelight-desktop = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight"}
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc"}
#filekit
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
#nucleus
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-darkmode-detector = { module = "dev.nucleusframework:nucleus.darkmode-detector", version.ref = "nucleus" }
nucleus-updater = { module = "dev.nucleusframework:nucleus.updater-runtime", version.ref = "nucleus" }
#bossterm
bossterm-compose = { module = "com.risaboss:bossterm-compose", version.ref = "bossterm"}
bossterm-core = { module = "com.risaboss:bossterm-core", version.ref = "bossterm"}
#mina
mina-common = { module = "org.apache.sshd:sshd-common", version.ref = "mina" }
mina-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "mina" }
mina-scp = { module = "org.apache.sshd:sshd-scp", version.ref = "mina" }

bouncy-castle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncy-castle"}
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }
appdirs = { module ="net.harawata:appdirs", version.ref = "appdirs"}

#Gradle plugin artifacts (consumed by build-logic convention plugins)
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-compose-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-multiplatform-plugin = { module = "org.jetbrains.compose:org.jetbrains.compose.gradle.plugin", version.ref = "cmp" }
detekt-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
koin-plugin = { module = "io.insert-koin:koin-compiler-gradle-plugin", version.ref = "koin-plugin" }
sqldelight-plugin = { module = "app.cash.sqldelight:app.cash.sqldelight.gradle.plugin", version.ref = "sqldelight" }

[plugins]
#convention plugins (defined in build-logic)
project-root = { id = "project.root" }
project-compose-library = { id = "project.compose.library" }
project-kotlin-library = { id = "project.kotlin.library" }
project-sqldelight = { id = "project.sqldelight" }
#app module plugins
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
nucleus = { id = "dev.nucleusframework", version.ref = "nucleus" }
