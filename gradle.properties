# The defaults are too small to compile this project from scratch.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# The release version, and the tag is v<appVersion>. Change it with scripts/release.sh, which also tags and pushes.
# Packages only get the part before any "-", because jpackage and Nucleus only take numbers.
appVersion=1.0.0-alpha
