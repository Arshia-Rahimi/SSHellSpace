name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      # Only pushes to main write the Gradle cache, so pull requests can't poison it.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
