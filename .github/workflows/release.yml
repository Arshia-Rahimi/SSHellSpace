# scripts/release.sh, run on main, pushes a v<appVersion> tag (gradle.properties). This checks it, then builds all three
# OSes into a draft release.
# Publish the draft by hand once every job has uploaded, so no client sees a manifest before its signatures. See CLAUDE.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    # It runs the project's code, so it gets no write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag pushed by hand could point anywhere, so this holds even without the script.
      - name: Check the tagged commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi
      - name: Check the tag matches appVersion
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version in gradle.properties"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'

  draft:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: ':app:packageDmg :app:packageZip'
          - os: windows-latest
            tasks: ':app:packageNsis'
          - os: ubuntu-latest
            tasks: ':app:packageAppImage'
    runs-on: ${{ matrix.os }}
    # Add required reviewers to this environment in the repo settings to gate use of the signing key.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew ${{ matrix.tasks }}
      - name: Sign the updates
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          export UPDATE_SIGNING_KEY="$RUNNER_TEMP/update-signing.key"
          printf '%s' "$SIGNING_KEY" > "$UPDATE_SIGNING_KEY"
          ./gradlew :app:signUpdates
          rm -f "$UPDATE_SIGNING_KEY"
      # Only the ZIP's latest-mac.yml goes up: the DMG's has the same name and would win if uploaded last.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/compose/binaries/main
          files=$(find . -mindepth 2 -maxdepth 2 -type f \
            ! -name package.json ! -name packaging-metadata.json \
            \( ! -path './dmg/*' -o -name '*.dmg' \))
          echo "$files"
          gh release upload "$GITHUB_REF_NAME" $files --clobber
